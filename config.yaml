# config.yaml - C++ Daily Digest 통합 설정

# =============================================================================
# LLM API 설정
# =============================================================================
llm:
  enabled: true
  provider: openai                # openai | anthropic | google | openrouter | ollama | custom
  model: gpt-6-luna
  # base_url: https://api.openai.com/v1    # custom 엔드포인트 사용 시
  temperature: 0.3
  reasoning_effort: none          # 번역 전용: 추론 비활성화
  max_completion_tokens: 8000     # 기사 10개의 번역 출력 상한; 실제 생성량만 과금
  timeout: 120                    # 배치 처리를 위해 증가 (10개 기사 처리 시간)
  retry_count: 3
  retry_delay: 5                  # 일시적 API 오류 재시도 대기
  rate_limit_delay: 1             # 배치 사이 대기 (계정 rate limit에 맞게 조정)
  batch_size: 10                  # 한 번에 처리할 기사 수 (API 호출 최적화)
  # 한국어/전문 용어 규칙은 prompts/system.txt에서 관리.
  # 제목과 RSS 설명 앞 500자만 번역. 요약/코드 분석/LLM 분류는 요청하지 않음.

# =============================================================================
# RSS 피드 목록
# =============================================================================
feeds:
  # 공식 및 표준
  ISO C++: https://isocpp.org/blog/rss
  Herb Sutter: https://herbsutter.com/feed/
  Microsoft C++ Team: https://devblogs.microsoft.com/cppblog/feed/
  Barry Revzin: https://brevzin.github.io/feed.xml

  # 고품질 기술 블로그
  C++ Stories: https://www.cppstories.com/index.xml
  Modernes C++: https://www.modernescpp.com/index.php/feed
  Fluent C++: https://www.fluentcpp.com/feed/
  Arthur O'Dwyer: https://quuxplusone.github.io/blog/feed.xml
  Andrzej Krzemienski: https://akrzemi1.wordpress.com/feed/
  Sandor Dargo: https://www.sandordargo.com/feed.xml
  Shafik Yaghmour: https://shafik.github.io/feed.xml

  # 커뮤니티 및 도구
  Reddit r/cpp: https://www.reddit.com/r/cpp/top/.rss?t=day
  JetBrains CLion: https://blog.jetbrains.com/clion/feed/
  Easyperf: https://easyperf.net/feed.xml
  KDAB: https://www.kdab.com/feed/
  Hacking C++: https://hackingcpp.com/feed.xml

# =============================================================================
# 카테고리 분류 설정
# =============================================================================
categorization:
  enabled: false                  # 선택적 키워드 기반 그룹화 (LLM 분류 아님)
  categories:
    standard:
      name: "📋 표준 및 제안"
      keywords: ["c++26", "c++23", "c++20", "standard", "proposal", "wg21", "iso", "p0", "p1", "p2", "n4"]
    performance:
      name: "⚡ 성능 최적화"
      keywords: ["performance", "optimization", "benchmark", "simd", "vectorization", "cache", "profiling", "latency", "throughput"]
    concurrency:
      name: "🔄 동시성"
      keywords: ["coroutine", "async", "thread", "concurrency", "parallel", "atomic", "mutex", "future", "co_await", "co_yield"]
    modern:
      name: "✨ 모던 C++"
      keywords: ["ranges", "concepts", "modules", "constexpr", "consteval", "template", "lambda", "auto", "span", "optional", "variant"]
    tools:
      name: "🛠️ 도구 및 빌드"
      keywords: ["compiler", "cmake", "clang", "gcc", "msvc", "vcpkg", "conan", "sanitizer", "debugger", "ide", "clion"]
    safety:
      name: "🛡️ 안전성"
      keywords: ["safety", "memory", "undefined behavior", "ub", "lifetime", "dangling", "bounds", "leak"]
    general:
      name: "📰 일반"
      keywords: []                # 기본 카테고리 (매칭 안 되면 여기로)

# =============================================================================
# Discord 설정
# =============================================================================
discord:
  embed_color: 0x0052CC
  max_articles_per_category: 5

# =============================================================================
# 스케줄 설정
# =============================================================================
schedule:
  # 실행 시간은 .github/workflows/daily-digest.yml의 cron에서 설정 (KST 09:00).
  lookback_hours: 24
